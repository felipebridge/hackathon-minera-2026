apiVersion: apps/v1
kind: Deployment
metadata:
  name: mineria-api
  namespace: mineria-capacitacion
  labels:
    app: mineria-api
    version: "1.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mineria-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0  
  template:
    metadata:
      labels:
        app: mineria-api
    spec:
      containers:
        - name: api
          image: ghcr.io/tu-org/mineria-capacitacion/api:latest
          ports:
            - containerPort: 3001
          envFrom:
            - secretRef:
                name: mineria-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: mineria-api-service
  namespace: mineria-capacitacion
spec:
  selector:
    app: mineria-api
  ports:
    - port: 3001
      targetPort: 3001
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mineria-web
  namespace: mineria-capacitacion
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mineria-web
  template:
    metadata:
      labels:
        app: mineria-web
    spec:
      containers:
        - name: web
          image: ghcr.io/tu-org/mineria-capacitacion/web:latest
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              valueFrom:
                configMapKeyRef:
                  name: mineria-config
                  key: api-url
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: mineria-web-service
  namespace: mineria-capacitacion
spec:
  selector:
    app: mineria-web
  ports:
    - port: 3000
      targetPort: 3000
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mineria-ingress
  namespace: mineria-capacitacion
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  tls:
    - hosts:
        - mineria.tu-empresa.com
      secretName: mineria-tls
  rules:
    - host: mineria.tu-empresa.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: mineria-api-service
                port:
                  number: 3001
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mineria-web-service
                port:
                  number: 3000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mineria-api-hpa
  namespace: mineria-capacitacion
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mineria-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
