version: '3.9'

networks:
  red-mineria-prod:
    driver: bridge

volumes:
  postgres-datos-prod:
  redis-datos-prod:

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: mineria-postgres-prod
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-datos-prod:/var/lib/postgresql/data
    networks:
      - red-mineria-prod

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mineria-redis-prod
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD} --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-datos-prod:/data
    networks:
      - red-mineria-prod

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: produccion
    container_name: mineria-api-prod
    restart: always
    env_file: .env
    environment:
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - red-mineria-prod
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: produccion
    container_name: mineria-web-prod
    restart: always
    env_file: .env
    environment:
      NODE_ENV: production
    depends_on:
      - api
    networks:
      - red-mineria-prod

  nginx:
    image: nginx:1.25-alpine
    container_name: mineria-nginx-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infraestructura/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infraestructura/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
      - web
    networks:
      - red-mineria-prod
